<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG Image — REFUGIO Madrid 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f1e6c8;
    --ink:#0e0e0e;
    --red:#cc3a2c;
    --yellow:#f1b91e;
    --blue:#2362ab;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1200px;
    height:630px;
    background:var(--cream);
    color:var(--ink);
    font-family:"Space Grotesk",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .card{
    width:1200px;
    height:630px;
    display:grid;
    grid-template-columns:460px 1fr;
    border:6px solid var(--ink);
  }
  .logo-col{
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:6px solid var(--ink);
  }
  .logo-col svg{
    width:340px;
    height:340px;
  }
  .text-col{
    padding:60px 70px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  h1{
    font-family:"Archivo Black",sans-serif;
    font-size:108px;
    line-height:0.88;
    letter-spacing:-0.015em;
    text-transform:uppercase;
  }
  h1 span{display:block}
  h1 .l2{color:var(--red)}
  h1 .l3{color:var(--blue)}
  .tagline{
    font-size:26px;
    line-height:1.35;
    max-width:36ch;
    margin-top:32px;
    font-weight:500;
  }
  .date{
    font-family:"Archivo Black",sans-serif;
    font-size:18px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    border-top:5px solid var(--ink);
    padding-top:22px;
    margin-top:24px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-col">
      <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#0e0e0e" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M64 138 L64 64 L104 64"/>
          <path d="M94 54 L104 64 L94 74"/>
          <path d="M206 64 L256 64 L256 138"/>
          <path d="M246 128 L256 138 L266 128"/>
          <path d="M256 240 L256 280 L64 280 L64 240"/>
          <path d="M54 250 L64 240 L74 250"/>
        </g>
        <rect x="104" y="28" width="92" height="92" fill="#0e0e0e"/>
        <rect x="8" y="148" width="92" height="92" fill="#0e0e0e"/>
        <rect x="200" y="148" width="92" height="92" fill="#0e0e0e"/>
        <rect x="114" y="18" width="92" height="92" fill="#f1b91e"/>
        <rect x="18" y="138" width="92" height="92" fill="#cc3a2c"/>
        <rect x="210" y="138" width="92" height="92" fill="#2362ab"/>
      </svg>
    </div>
    <div class="text-col">
      <div>
        <h1>
          <span class="l1">Refugio</span>
          <span class="l2">Madrid</span>
          <span class="l3">2026</span>
        </h1>
        <p class="tagline">Una jornada para conectar al mejor talento técnico en Madrid.</p>
      </div>
      <div class="date">Sábado · 27 de junio de 2026 · Madrid</div>
    </div>
  </div>
</body>
</html>
