<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>REFUGIO Madrid 2026 — Speakers</title>
        <meta
            name="description"
            content="Fichas de speakers confirmados de REFUGIO Madrid 2026."
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --ink: #0e0e0e;
                --cream: #f3ead1;
                --red: #d73a31;
                --yellow: #f4bd2f;
                --blue: #2368b7;
                --rule: 4px;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                margin: 0;
                background: var(--cream);
                color: var(--ink);
                font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            a {
                color: inherit;
            }
            .wrap {
                max-width: 1180px;
                margin: 0 auto;
                min-height: 100vh;
                padding: 28px 30px 70px;
                border-left: var(--rule) solid var(--ink);
                border-right: var(--rule) solid var(--ink);
            }
            .topbar,
            .footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 18px;
                padding: 14px 0 20px;
                border-bottom: var(--rule) solid var(--ink);
                font-size: 13px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
            .footer {
                border-top: var(--rule) solid var(--ink);
                border-bottom: 0;
                margin-top: 36px;
                padding: 22px 0 0;
            }
            .back {
                font-family: "Archivo Black", sans-serif;
                text-decoration: none;
            }
            .hero {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 28px;
                align-items: end;
                padding: 54px 0 34px;
                border-bottom: var(--rule) solid var(--ink);
            }
            h1 {
                margin: 0;
                font-family: "Archivo Black", sans-serif;
                font-size: clamp(48px, 8vw, 104px);
                line-height: 0.88;
                text-transform: uppercase;
            }
            h1 span {
                display: block;
            }
            h1 .red {
                color: var(--red);
            }
            h1 .blue {
                color: var(--blue);
            }
            .hero p {
                max-width: 420px;
                margin: 0;
                font-size: 18px;
                line-height: 1.45;
            }
            .cards {
                display: grid;
                grid-template-columns: 1fr;
                gap: 28px;
                max-width: 900px;
                margin: 0 auto;
                padding-top: 34px;
            }
            .speaker {
                scroll-margin-top: 24px;
            }
            .card-frame {
                display: block;
                width: 100%;
                aspect-ratio: 1731 / 1299;
                border: var(--rule) solid var(--ink);
                background-color: var(--cream);
                background-repeat: no-repeat;
                background-position: center;
                background-size: calc(100% + 4px) calc(100% + 4px);
                overflow: hidden;
                user-select: none;
                -webkit-user-drag: none;
            }
            .more-speakers {
                margin-top: 8px;
                aspect-ratio: 1731 / 1299;
                border: var(--rule) solid var(--ink);
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--ink);
                color: var(--cream);
                font-family: "Archivo Black", sans-serif;
                font-size: clamp(30px, 5vw, 58px);
                line-height: 1;
                letter-spacing: 0.05em;
                text-align: center;
                text-transform: uppercase;
            }
            @media (max-width: 820px) {
                .wrap {
                    padding: 20px 16px 50px;
                    border-left: 0;
                    border-right: 0;
                }
                .topbar,
                .footer,
                .hero {
                    grid-template-columns: 1fr;
                    flex-direction: column;
                    align-items: flex-start;
                }
                .cards {
                    gap: 24px;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header class="topbar">
                <span><b>REFUGIO</b> · Madrid · 2026</span>
                <a class="back" href="index.html">Volver a la web</a>
            </header>

            <main>
                <section class="hero">
                    <h1>
                        <span>Speakers</span>
                        <span class="red">REFUGIO</span>
                        <span class="blue">2026</span>
                    </h1>
                </section>

                <section class="cards" aria-label="Fichas de speakers">
                    <article class="speaker" id="guillermo">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Guillermo García Cobo"
                            style="background-image: url('cards/guillermo-garcia.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="daniel">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Daniel Gallo"
                            style="background-image: url('cards/daniel-gallo.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="mihura">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Mihura"
                            style="background-image: url('cards/mihura.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="maisa">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha conjunta de David Villalón y Manuel Romero"
                            style="background-image: url('cards/maisa-ai.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="chefo">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Chefo Hernanz"
                            style="background-image: url('cards/chefo-hernanz.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="antonio">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Antonio Artés Rodríguez"
                            style="background-image: url('cards/antonio-artes.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="guli">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Guli Moreno Pubul"
                            style="background-image: url('cards/guli-moreno.png')"
                        ></div>
                    </article>

                    <article class="speaker" id="aquilino">
                        <div
                            class="card-frame"
                            role="img"
                            aria-label="Ficha de Aquilino Peña"
                            style="background-image: url('cards/aquilino-pena.png')"
                        ></div>
                    </article>
                </section>
            </main>

            <footer class="footer">
                <span>REFUGIO · Madrid · 2026</span>
                <span>Sábado 27 de junio</span>
            </footer>
        </div>
    </body>
</html>
